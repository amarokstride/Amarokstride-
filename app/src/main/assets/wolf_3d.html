<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#121b23; }
  canvas { display:block; width:100%; height:100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<canvas id="sceneCanvas"></canvas>
<script>
(function() {
  var currentGait = 'idle';
  var clockT = 0;
  var coatColors = { body: '#5c6872', dark: '#2a333c', frost: '#dbe9f2', eye: '#7be6ff' };
  var matRefs = null;

  window.setWolfGait = function(g) {
    currentGait = g || 'idle';
  };

  window.setWolfCoat = function(b, d, f, e) {
    coatColors = { body: b || '#5c6872', dark: d || '#2a333c', frost: f || '#dbe9f2', eye: e || '#7be6ff' };
    if (matRefs) {
      matRefs.body.color.set(coatColors.body);
      matRefs.dark.color.set(coatColors.dark);
      matRefs.frost.color.set(coatColors.frost);
      matRefs.eye.color.set(coatColors.eye);
    }
  };

  var canvas = document.getElementById('sceneCanvas');

  function startThreeScene() {
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x131d26, 1);

    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x131d26, 0.08);

    var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 60);
    camera.position.set(3.4, 2.0, 3.6);
    camera.lookAt(0, 0.85, 0);

    scene.add(new THREE.AmbientLight(0x8ec8df, 0.75));
    var dirLight = new THREE.DirectionalLight(0xfff1dc, 1.15);
    dirLight.position.set(4, 7, 5);
    scene.add(dirLight);
    var rimLight = new THREE.PointLight(0x6bd8f5, 1.4, 14);
    rimLight.position.set(-2.5, 2.8, -2.0);
    scene.add(rimLight);

    // Trail rock base
    var groundMat = new THREE.MeshStandardMaterial({ color: 0x263542, roughness: 0.9 });
    var base = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.3, 0.25, 24), groundMat);
    base.position.y = -0.12;
    scene.add(base);

    // Glowing trail ring
    var ring = new THREE.Mesh(
      new THREE.TorusGeometry(1.75, 0.04, 12, 48),
      new THREE.MeshBasicMaterial({ color: 0x6bd8f5 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.02;
    scene.add(ring);

    // Articulated low-poly Wolf
    var wolf = new THREE.Group();
    scene.add(wolf);

    var furGrey = new THREE.MeshStandardMaterial({ color: coatColors.body, roughness: 0.75 });
    var furDark = new THREE.MeshStandardMaterial({ color: coatColors.dark, roughness: 0.8 });
    var furFrost = new THREE.MeshStandardMaterial({ color: coatColors.frost, roughness: 0.65 });
    var eyeGlow = new THREE.MeshBasicMaterial({ color: coatColors.eye });
    matRefs = { body: furGrey, dark: furDark, frost: furFrost, eye: eyeGlow };

    var body = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.56, 1.42), furGrey);
    body.position.set(0, 0.92, 0);
    wolf.add(body);

    var chest = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.54, 0.52), furFrost);
    chest.position.set(0, 0.90, 0.48);
    wolf.add(chest);

    var backRidge = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.14, 1.2), furDark);
    backRidge.position.set(0, 1.24, -0.05);
    wolf.add(backRidge);

    var neckPivot = new THREE.Group();
    neckPivot.position.set(0, 1.12, 0.65);
    wolf.add(neckPivot);

    var head = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.44, 0.52), furGrey);
    head.position.set(0, 0.18, 0.18);
    neckPivot.add(head);

    var snout = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.22, 0.36), furFrost);
    snout.position.set(0, 0.10, 0.52);
    neckPivot.add(snout);

    var nose = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.09, 0.08), furDark);
    nose.position.set(0, 0.15, 0.70);
    neckPivot.add(nose);

    var earL = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.28, 4), furDark);
    earL.position.set(0.14, 0.48, 0.14);
    neckPivot.add(earL);
    var earR = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.28, 4), furDark);
    earR.position.set(-0.14, 0.48, 0.14);
    neckPivot.add(earR);

    var eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.05), eyeGlow);
    eyeL.position.set(0.18, 0.24, 0.43);
    neckPivot.add(eyeL);
    var eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.05), eyeGlow);
    eyeR.position.set(-0.18, 0.24, 0.43);
    neckPivot.add(eyeR);

    var tailPivot = new THREE.Group();
    tailPivot.position.set(0, 1.05, -0.72);
    wolf.add(tailPivot);
    var tail = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.22, 0.76), furDark);
    tail.position.set(0, -0.08, -0.35);
    tail.rotation.x = -0.32;
    tailPivot.add(tail);

    function makeLeg(x, z) {
      var p = new THREE.Group();
      p.position.set(x, 0.68, z);
      var upper = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.68, 0.20), furGrey);
      upper.position.y = -0.34;
      p.add(upper);
      var paw = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.10, 0.26), furFrost);
      paw.position.set(0, -0.66, 0.04);
      p.add(paw);
      wolf.add(p);
      return p;
    }

    var legFL = makeLeg(0.22, 0.50);
    var legFR = makeLeg(-0.22, 0.50);
    var legBL = makeLeg(0.22, -0.50);
    var legBR = makeLeg(-0.22, -0.50);

    // Moon orb for howl aura
    var moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.32, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xbceeff })
    );
    moon.position.set(-1.6, 2.3, -1.8);
    scene.add(moon);

    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      clockT += 0.032;
      var t = clockT;

      if (currentGait === 'howl') {
        wolf.position.y = 0.02 * Math.sin(t * 2.5);
        wolf.rotation.x = -0.18;
        neckPivot.rotation.x = -0.82 + 0.08 * Math.sin(t * 7.0);
        legFL.rotation.x = 0.15; legFR.rotation.x = 0.15;
        legBL.rotation.x = -0.25; legBR.rotation.x = -0.25;
        tailPivot.rotation.y = 0.2 * Math.sin(t * 5.0);
        ring.scale.setScalar(1.0 + 0.08 * Math.sin(t * 6.0));
        rimLight.intensity = 2.4 + 0.6 * Math.sin(t * 8.0);
      } else if (currentGait === 'run') {
        var s = t * 5.4;
        wolf.position.y = Math.abs(Math.sin(s)) * 0.22;
        wolf.rotation.x = 0.10 * Math.cos(s);
        neckPivot.rotation.x = 0.14;
        legFL.rotation.x = Math.sin(s) * 0.85;
        legFR.rotation.x = Math.sin(s + 0.45) * 0.85;
        legBL.rotation.x = -Math.sin(s) * 0.85;
        legBR.rotation.x = -Math.sin(s + 0.45) * 0.85;
        tailPivot.rotation.y = 0.35 * Math.sin(s * 0.8);
        ring.scale.setScalar(1.0);
        rimLight.intensity = 1.6;
      } else if (currentGait === 'trot') {
        var s = t * 3.4;
        wolf.position.y = Math.abs(Math.sin(s)) * 0.11;
        wolf.rotation.x = 0.04 * Math.cos(s);
        neckPivot.rotation.x = 0.05;
        legFL.rotation.x = Math.sin(s) * 0.55;
        legBR.rotation.x = Math.sin(s) * 0.55;
        legFR.rotation.x = -Math.sin(s) * 0.55;
        legBL.rotation.x = -Math.sin(s) * 0.55;
        tailPivot.rotation.y = 0.25 * Math.sin(s);
        ring.scale.setScalar(1.0);
        rimLight.intensity = 1.4;
      } else if (currentGait === 'walk') {
        var s = t * 1.9;
        wolf.position.y = Math.abs(Math.sin(s)) * 0.04;
        wolf.rotation.x = 0;
        neckPivot.rotation.x = 0.03 * Math.sin(s);
        legFL.rotation.x = Math.sin(s) * 0.32;
        legBR.rotation.x = Math.sin(s + 0.8) * 0.32;
        legFR.rotation.x = -Math.sin(s) * 0.32;
        legBL.rotation.x = -Math.sin(s + 0.8) * 0.32;
        tailPivot.rotation.y = 0.18 * Math.sin(s);
        ring.scale.setScalar(1.0);
        rimLight.intensity = 1.25;
      } else {
        wolf.position.y = 0.02 * Math.sin(t * 1.5);
        wolf.rotation.x = 0;
        neckPivot.rotation.x = 0.06 * Math.sin(t * 1.1);
        legFL.rotation.x = 0; legFR.rotation.x = 0;
        legBL.rotation.x = 0; legBR.rotation.x = 0;
        tailPivot.rotation.y = 0.22 * Math.sin(t * 2.0);
        ring.scale.setScalar(1.0);
        rimLight.intensity = 1.2;
      }

      wolf.rotation.y = Math.sin(t * 0.35) * 0.42 + 0.45;
      renderer.render(scene, camera);
    }
    animate();
  }

  function startOfflineCanvasFallback() {
    var ctx = canvas.getContext('2d');
    function draw() {
      requestAnimationFrame(draw);
      clockT += 0.04;
      var w = canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
      var h = canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
      ctx.fillStyle = '#131d26';
      ctx.fillRect(0, 0, w, h);

      var cx = w * 0.5, cy = h * 0.58;
      var s = Math.min(w, h) * 0.28;
      var speed = currentGait === 'run' ? 5.2 : (currentGait === 'trot' ? 3.2 : (currentGait === 'walk' ? 1.8 : 0.8));
      var bob = currentGait === 'idle' ? Math.sin(clockT * 1.6) * 4 : Math.abs(Math.sin(clockT * speed)) * s * 0.16;

      // Frost halo
      ctx.strokeStyle = currentGait === 'howl' ? '#8ce8ff' : '#3a7a94';
      ctx.lineWidth = Math.max(2, s * 0.04);
      ctx.beginPath();
      ctx.ellipse(cx, cy + s * 0.52, s * 1.2, s * 0.24, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Stylized wolf silhouette
      ctx.save();
      ctx.translate(cx, cy - bob);
      ctx.fillStyle = '#60707d';
      ctx.fillRect(-s * 0.62, -s * 0.28, s * 1.15, s * 0.46);
      // Legs
      var swing = currentGait === 'idle' || currentGait === 'howl' ? 0 : Math.sin(clockT * speed) * s * 0.28;
      ctx.strokeStyle = '#99b4c4';
      ctx.lineWidth = s * 0.13;
      ctx.lineCap = 'round';
      [[-0.45, swing], [-0.25, -swing], [0.25, -swing], [0.42, swing]].forEach(function(lg) {
        ctx.beginPath();
        ctx.moveTo(lg[0] * s, s * 0.14);
        ctx.lineTo(lg[0] * s + lg[1], s * 0.52);
        ctx.stroke();
      });
      // Head
      ctx.save();
      ctx.translate(s * 0.54, -s * 0.26);
      if (currentGait === 'howl') ctx.rotate(-0.68);
      ctx.fillStyle = '#7c909e';
      ctx.fillRect(-s * 0.12, -s * 0.22, s * 0.42, s * 0.34);
      ctx.fillStyle = '#8ce8ff';
      ctx.fillRect(s * 0.14, -s * 0.12, s * 0.08, s * 0.08);
      ctx.restore();
      ctx.restore();
    }
    draw();
  }

  if (typeof THREE !== 'undefined') {
    try { startThreeScene(); } catch (e) { startOfflineCanvasFallback(); }
  } else {
    startOfflineCanvasFallback();
  }
})();
</script>
</body>
</html>
